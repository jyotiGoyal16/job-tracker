<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"></stop>
      <stop offset="100%" stop-color="#2563EB"></stop>
    </linearGradient>
    <linearGradient id="clipboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"></stop>
      <stop offset="100%" stop-color="#2563EB"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="white"></rect>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#ringGradient)" stroke-width="12"></circle>

  <!-- Clipboard -->
  <rect x="72" y="56" width="96" height="128" rx="12" fill="white" stroke="url(#clipboardGradient)" stroke-width="8"></rect>

  <!-- Clipboard top -->
  <rect x="104" y="40" width="48" height="24" rx="8" fill="#1E3A8A"></rect>

  <!-- Checklist lines -->
  <circle cx="92" cy="96" r="8" fill="#22C55E"></circle>
  <path d="M88 96 L91 99 L97 92" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
  <line x1="108" y1="96" x2="148" y2="96" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"></line>

  <circle cx="92" cy="124" r="8" fill="none" stroke="#2563EB" stroke-width="3"></circle>
  <line x1="108" y1="124" x2="148" y2="124" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"></line>

  <circle cx="92" cy="152" r="8" fill="none" stroke="#CBD5E1" stroke-width="3"></circle>
  <line x1="108" y1="152" x2="148" y2="152" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"></line>

  <!-- Briefcase -->
  <rect x="132" y="140" width="64" height="44" rx="8" fill="#1E3A8A"></rect>
  <rect x="150" y="132" width="28" height="12" rx="4" fill="none" stroke="#1E3A8A" stroke-width="4"></rect>
  <rect x="156" y="156" width="16" height="12" rx="2" fill="white"></rect>

  <!-- Green checkmark -->
  <path d="M68 184 L92 208 L144 160" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>